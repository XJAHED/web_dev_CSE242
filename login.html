<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">
    <div class="py-6 px-4 w-full">
        <div class=" items-center gap-6 max-w-6xl w-full mx-auto">

            <!-- Login Form -->
            <div class="grid grid-cols-2 gap-5 border-slate-300 rounded-lg p-[120px] w-full shadow-[0_2px_22px_-4px_rgba(93,96,127,0.2)] max-lg:mx-auto bg-white">
                <form class="space-y-6">
                    <div class="mb-12">
                        <h1 class="text-slate-900 text-3xl font-semibold text-center">Login</h1>
                    
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="text-slate-900 text-sm font-medium mb-2 block">User name</label>
                        <div class="relative flex items-center">
                            <input name="username" type="text" required
                                class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3 rounded-lg outline-blue-600"
                                placeholder="Enter user name" />
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-slate-900 text-sm font-medium mb-2 block">Password</label>
                        <div class="relative flex items-center">
                            <input name="password" type="password" required
                                class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3 rounded-lg outline-blue-600"
                                placeholder="Enter password" />
                        </div>
                    </div>

                    <!-- Remember -->
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox"
                                class="h-4 w-4 text-blue-600 border-slate-300 rounded" />
                            <label for="remember-me" class="ml-3 block text-sm text-slate-900">
                                Remember me
                            </label>
                        </div>

                        <div class="text-sm">
                            <a href="#" class="text-blue-600 hover:underline font-medium">
                                Forgot your password?
                            </a>
                        </div>
                    </div>

                    <!-- Button -->
                    <div class="!mt-12">
                        <button type="button"
                            class="w-full shadow-xl py-2.5 px-4 text-[15px] font-medium rounded-lg text-white bg-[#D1A054] ">
                            Sign in
                        </button>

                        <p class="text-sm !mt-6 text-center text-slate-600">
                            Don't have an account
                            <a href="./registration.html" class="text-[#D1A054] font-medium hover:underline ml-1">
                                Register here
                            </a>
                        </p>
                    </div>
                </form>
                <!-- Image -->
                <div class="flex items-center justify-center">
                    <img src="./images/image.png"
                        class="max-w-full max-h-full object-contain"
                        alt="login img" />
                </div>
            </div>

           

        </div>
    </div>
</div>

</body>
</html>
