<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">
    <div class="py-6 px-4 w-full">
        <div class=" items-center gap-6 max-w-6xl w-full mx-auto">

            <!-- Login Form -->
            <div class="grid grid-cols-2 gap-7 border-slate-300 rounded-lg p-[120px] w-full shadow-[0_2px_22px_-4px_rgba(93,96,127,0.2)] max-lg:mx-auto bg-white">

                <div class="flex items-center justify-center">
                    <img src="./images/image.png"
                        class="max-w-full max-h-full object-contain"
                        alt="login img" />
                </div>

                <form class="space-y-6">
                    <div class="mb-12">
                        <h1 class="text-slate-900 text-3xl font-semibold">Sign up</h1>
                        
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="text-slate-900 text-sm font-medium mb-2 block">User name</label>
                        <div class="relative flex items-center">
                            <input name="username" type="text" required
                                class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3 rounded-lg outline-blue-600"
                                placeholder="Enter user name" />
                        </div>
                    </div>

                    <!-- Gmail -->
                    <div>
                        <label class="text-slate-900 text-sm font-medium mb-2 block">Gmail</label>
                        <div class="relative flex items-center">
                            <input name="username" type="email" required
                                class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3 rounded-lg outline-blue-600"
                                placeholder="Enter user name" />
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-slate-900 text-sm font-medium mb-2 block">Password</label>
                        <div class="relative flex items-center">
                            <input name="password" type="password" required
                                class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3 rounded-lg outline-blue-600"
                                placeholder="Enter password" />
                        </div>
                        <label class="text-slate-900 text-sm font-medium mb-2 block pt-3">Confirm Password</label>
                        <div class="relative flex items-center">
                            <input name="password" type="password" required
                                class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3 rounded-lg outline-blue-600"
                                placeholder="Enter password" />
                        </div>
                    </div>


                    <!-- Button -->
                    <div class="!mt-12">
                        <button type="button"
                            class="w-full shadow-xl py-2.5 px-4 text-[15px] font-medium rounded-lg text-white bg-[#D1A054]">
                            Sign up
                        </button>

                        <p class="text-sm !mt-6 text-center text-slate-600">
                            I have an account
                            <a href="login.html" class="text-[#D1A054] font-medium hover:underline ml-1">
                                login here
                            </a>
                        </p>
                    </div>
                </form>
                
            </div>

            

        </div>
    </div>
</div>

</body>
</html>
